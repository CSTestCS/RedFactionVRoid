; =====================================================================================
;  RedFactionVRoid - VRM skins for Mason (Red Faction Guerrilla Re-Mars-tered, Steam)
; =====================================================================================
;  This file is created next to rfg.exe on first launch. Edit it with any text editor;
;  changes apply the next time the game starts. Lines starting with ';' are comments.
;
;  Put .vrm files in the "vrm" folder next to rfg.exe, then pause the game and pick
;  "VRM SKIN" (or press Y on a controller / V on the keyboard while paused, or F7 anywhere).

[General]
Enabled=1
; Virtual-key code that opens the VRM menu at any time (0x76 = F7).
MenuHotkey=0x76
; Show the debug overlay at startup (toggle in game with F9).
Debug=0

[Scale]
; How the avatar is sized:
;   auto   - match Mason's skeleton measured in game (head height above the feet);
;            falls back to MasonHeight until the skeleton has been measured.
;   height - make the avatar's total height (feet to top of head) equal MasonHeight.
;   none   - keep the size the avatar was authored at.
Mode=auto
; Mason's height in metres, used by "height" mode and as the fallback for "auto".
MasonHeight=1.83
; Extra multiplier applied after automatic sizing.
Multiplier=1.0

[Menu]
; Layout of the game's pause menu in 1280x720 reference pixels (scaled to your resolution).
; The VRM SKIN entry is drawn one row below the last game entry (QUIT GAME).
FirstRowY=300
RowHeight=44
MenuItems=7
ResumeRow=0
EntryX=442
; Leave empty to place the entry automatically below the last row.
EntryY=
TextSize=30
ShowEntryHint=1
MenuFont=Arial Black
HintFont=Impact
BodyFont=Segoe UI

[Render]
; Depth testing against the game world:
;   none     - the avatar is drawn over the scene (safe default; walls in front of Mason
;              will not hide the avatar)
;   standard - use the game's depth buffer (0 = near). Needs a correct camera Near/Far.
;   reversed - use the game's depth buffer with reversed Z (1 = near).
DepthMode=none
; Lighting:
;   scene - light the avatar from the game's own rendered image around Mason: bright
;           desert sun, dark tunnels, red alarm lights and explosions all carry over.
;   fixed - a constant toon light (LightDir / LightColor / Ambient below).
Lighting=scene
; How far around Mason (in metres) to look for light, and how the image maps to light.
SceneRadius=1.5
SceneExposure=2.0
SceneMinBrightness=0.22
SceneMaxBrightness=1.25
; 0 = only brightness, 1 = full colour of the surroundings.
SceneSaturation=0.45
; Key light direction in game world space (towards the light) when the sun's position is
; not known ([GameLighting]); colour and ambient are used by Lighting=fixed.
LightDir=0.3,0.8,0.5
LightColor=1.0,0.95,0.9
Ambient=0.35,0.3,0.3
; Don't draw the avatar in the world while the pause menu is open (the game blurs the scene).
HideWhenPaused=1
; Keep the avatar's feet at the height of Mason's feet.
GroundFeet=1

[Physics]
; Spring-bone physics for hair, skirts, tails and accessories (as set up in the VRM file).
Enabled=1
; Optional gentle wind (0 = none, try 0.5 - 2).
Wind=0

[Expressions]
; Resting face when no other choice is saved (change it in game: VRM menu -> FACE).
Default=neutral
AutoBlink=1
; Reactions, if [GameState] Health is configured. Use expression names from the avatar
; (presets: happy, angry, sad, relaxed, surprised; or the avatar's custom names).
Hurt=angry
LowHealth=sad
LowHealthFraction=0.25

; -------------------------------------------------------------------------------------
;  GAME BINDING
;  Where Mason's skeleton, the camera and the pause flag live in rfg.exe's memory.
;  These depend on the exact game build. Values are pointer paths:
;     [x]            read the 64-bit pointer stored at address x
;     rfg.exe+0x123  address relative to the game executable
;     sig("48 8B 05 ?? ?? ?? ??", 3)
;                    find this byte pattern in rfg.exe; with the second argument, follow
;                    the RIP-relative address stored at that offset (robust to patches)
;  Example: BoneArray=[[[rfg.exe+0x1A2B3C0]+0x58]+0x2F0]
;  See docs/CALIBRATION.md for how to find these with the in-game debug tools.
; -------------------------------------------------------------------------------------

[GameSkeleton]
; Address of Mason's first bone transform. Required for the avatar to follow Mason.
BoneArray=
; Bytes between consecutive bones and how each transform is stored:
;   matrix43  = 12 floats: right, up, forward vectors + position (Volition engine default)
;   float4x4  = 16 floats, D3D row-major;  float3x4 / float4x4t = transposed layouts
BoneStride=48
BoneFormat=matrix43
; 0 = read up to the highest index used in [BoneMap].
BoneCount=0
; world = bone transforms are already in world space; model = relative to PlayerTransform.
BoneSpace=world
PlayerTransform=
PlayerTransformFormat=matrix43
; Optional: array of pointers to bone-name strings (lets [BoneMap] use names).
BoneNameArray=
BoneNameStride=8
; Which axes of Mason's head bone point forward / up (for head turning).
HeadForwardAxis=+z
HeadUpAxis=+y
; The game's world is left-handed (D3D convention) and measured in metres.
Handedness=left
UnitsToMeters=1.0

[BoneMap]
; VRM humanoid bone = Mason bone index (or bone name if BoneNameArray is set).
; Missing entries are skipped; hips and head are required.
hips=
spine=
chest=
upperChest=
neck=
head=
leftShoulder=
leftUpperArm=
leftLowerArm=
leftHand=
leftMiddleProximal=
rightShoulder=
rightUpperArm=
rightLowerArm=
rightHand=
rightMiddleProximal=
leftUpperLeg=
leftLowerLeg=
leftFoot=
leftToes=
rightUpperLeg=
rightLowerLeg=
rightFoot=
rightToes=

[GameCamera]
; Camera world transform (right, up, forward, position) and vertical field of view.
Transform=
Format=matrix43
Fov=
FovUnits=degrees
FovAxis=vertical
FovDefault=70
Near=0.1
Far=2000

[GamePause]
; Optional byte/int that equals PausedValue while the pause menu is open. Without it the
; mod infers the pause menu from Esc / Start presses.
Flag=
Size=1
PausedValue=1

[GameHide]
; Optional memory writes applied while a VRM skin is shown, to hide Mason's own model:
;   WriteN = <pointer path> | <u8|u16|u32|f32> | <value>
; The original value is restored when the skin is turned off.
Write1=

[DrawFilter]
; Mason's mesh can also be hidden by skipping his draw calls. Find them in game with the
; draw logger (F10, then PgUp/PgDn and Insert); they are saved to RFVRoid_state.ini.
; You can also list them here as indexCount:startIndex pairs, e.g. 18432:0,9216:18432
HideDraws=
; Only consider draws that use skinned (BLENDINDICES) vertex layouts.
SkinnedOnly=1

[GameState]
; Optional: Mason's health, so the avatar winces when hit and looks worried when hurt.
Health=
HealthType=f32
; 0 = use the highest value seen as full health.
HealthMax=0

[GameLighting]
; Optional: the sun's direction (3 floats) and colour (3 floats) in game memory, so the
; avatar's shading matches the time of day. Without them the scene image is still used.
SunDirection=
; toSun = vector points towards the sun; fromSun = the direction sunlight travels.
SunDirectionMeaning=toSun
SunColor=
